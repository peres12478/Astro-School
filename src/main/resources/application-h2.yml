spring:
  datasource:
    url: jdbc:h2:file:./data/colegio
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update # Solo desarrollo. En produccion use migraciones Flyway/Liquibase.

# Acceso local para visualizar la MISMA base desde DBeaver mientras Spring Boot funciona.
# La conexion se hace por TCP a Spring Boot, NO abriendo el archivo .mv.db otra vez.
# H2 solo acepta conexiones del propio equipo: no usar -tcpAllowOthers.
# Modo de prueba local: crea cuentas ficticias y permite entrar sin escribir contraseña.
# IMPORTANTE: desactivar al utilizar datos reales (APP_DEMO_ENABLED=false).
app:
  demo:
    enabled: ${APP_DEMO_ENABLED:true}
  h2:
    tcp:
      enabled: ${H2_TCP_ENABLED:true}
      port: ${H2_TCP_PORT:9092}
