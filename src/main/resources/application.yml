server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    default: h2
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: none
    default-models-expand-depth: -1
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: false

app:
  registro-docente-clave: ${CLAVE_REGISTRO_DOCENTE:clave-docente-local-cambiar}
  jwt:
    secret-base64: ${APP_JWT_SECRET_BASE64:}
    expiration-minutes: 480
    qr-expiration-minutes: 1440
  correo:
    desde: ${APP_EMAIL_FROM:colegio@localhost}
  jitsi:
    base-url: https://meet.jit.si/
